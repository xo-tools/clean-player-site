<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Clean Player: a shield (protection) holding a play button, with a small sparkle (clean). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b4cf0"/>
      <stop offset="1" stop-color="#14b8c4"/>
    </linearGradient>
    <linearGradient id="play" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b4cf0"/>
      <stop offset="1" stop-color="#2a8fd6"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".22"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bg)"/>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#gloss)"/>
  <!-- shield -->
  <path d="M60 20 L94 31 C95 31 96 32 96 33 V60 C96 84 80 100 60 108 C40 100 24 84 24 60 V33 C24 32 25 31 26 31 Z"
        fill="#ffffff"/>
  <!-- play -->
  <path d="M51 46 L76 62 L51 78 Z" fill="url(#play)" stroke="url(#play)" stroke-width="7" stroke-linejoin="round"/>
  <!-- sparkle -->
  <path d="M104 14 C105 21 107 23 114 24 C107 25 105 27 104 34 C103 27 101 25 94 24 C101 23 103 21 104 14 Z" fill="#ffffff"/>
</svg>
